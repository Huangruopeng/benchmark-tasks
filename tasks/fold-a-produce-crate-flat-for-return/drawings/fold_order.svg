<polygon points="66.0,360.0 72.2,360.0 72.2,330.2 66.0,330.2" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="307.8,360.0 314.0,360.0 314.0,330.2 307.8,330.2" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="66.0,360.0 314.0,360.0 314.0,252.1 66.0,252.1" fill="none" fill-opacity="1.0" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" stroke-linejoin="round"/>
<polygon points="72.2,330.2 66.0,330.2 66.0,252.1 72.2,252.1" fill="#9fd1ab" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
