<text x="1006.0" y="90.0" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="bold">4  Long walls pushed in, flat on top</text>
<polygon points="1032.0,360.0 1280.0,360.0 1280.0,356.3 1032.0,356.3" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="1032.0,360.0 1038.2,360.0 1038.2,330.2 1032.0,330.2" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="1273.8,360.0 1280.0,360.0 1280.0,330.2 1273.8,330.2" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="1032.0,317.8 1280.0,317.8 1280.0,311.6 1032.0,311.6" fill="#9fd1ab" fill-opacity="0.7" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<text x="1156.0" y="301.7" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal">80 tall</text>
<polygon points="1038.2,330.2 1038.2,324.0 1116.3,324.0 1116.3,330.2" fill="#9fd1ab" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="1273.8,330.2 1273.8,324.0 1195.7,324.0 1195.7,330.2" fill="#9fd1ab" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<text x="40.0" y="430.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" font-weight="normal">Erecting is the reverse: long walls up, then each end wall up until both its catches click.</text>
</svg>
