<text x="362.0" y="90.0" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="bold">2  Near end wall: both buttons in, tip in</text>
<polygon points="388.0,360.0 636.0,360.0 636.0,356.3 388.0,356.3" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="388.0,360.0 394.2,360.0 394.2,330.2 388.0,330.2" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="629.8,360.0 636.0,360.0 636.0,330.2 629.8,330.2" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="388.0,360.0 636.0,360.0 636.0,252.1 388.0,252.1" fill="none" fill-opacity="1.0" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" stroke-linejoin="round"/>
<polygon points="394.2,330.2 388.1,329.0 404.4,252.5 410.4,253.8" fill="#9fd1ab" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="387.9" y1="216.2" x2="397.9" y2="256.2" stroke="#1b1b1b" stroke-width="0.8" marker-end="url(#dot)"/>
<text x="387.9" y="213.2" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">press both buttons</text>
<polygon points="629.8,330.2 636.0,330.2 636.0,252.1 629.8,252.1" fill="#9fd1ab" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<text x="684.0" y="90.0" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="bold">3  Both end walls flat</text>
<polygon points="710.0,360.0 958.0,360.0 958.0,356.3 710.0,356.3" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="710.0,360.0 716.2,360.0 716.2,330.2 710.0,330.2" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="951.8,360.0 958.0,360.0 958.0,330.2 951.8,330.2" fill="#cfe8d4" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="710.0,360.0 958.0,360.0 958.0,252.1 710.0,252.1" fill="none" fill-opacity="1.0" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" stroke-linejoin="round"/>
<polygon points="716.2,330.2 716.2,324.0 794.3,324.0 794.3,330.2" fill="#9fd1ab" fill-opacity="1.0" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>
