<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="470" viewBox="0 0 1340 470" font-family="Helvetica, Arial, sans-serif">
<title>Folding crate: fold order</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f4e9c"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="3" fill="#1b1b1b"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe8d4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5f8f6a" stroke-width="1"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="34.0" font-size="17" text-anchor="start" fill="#1b1b1b" font-weight="bold">Fold order (section along the crate&#x27;s middle; the long walls are behind, dashed).</text>
<text x="40.0" y="90.0" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="bold">1  Erect, all four catches latched</text>
