<text x="24.0" y="880.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Claws (numbered by their centre angle): 3 x 80 degrees, centred on 60, 180, 300; gaps of 40 degrees at 0, 120, 240. Lugs: 24 degrees wide at 0, 120, 240, so they pass the gaps while the ring is within 8 degrees of open.</text>
