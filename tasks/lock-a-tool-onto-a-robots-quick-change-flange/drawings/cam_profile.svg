<text x="24.0" y="854.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">A home plate&#x27;s lug fronts are 3.0 mm out, so on the dwell the lips overlap them by 0.2 mm: the ring moves 0.2 mm forward against its springs, which then press 14.7 N.</text>
