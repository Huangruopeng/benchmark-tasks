<text x="24.0" y="820.0" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Lead-in ramp: 9.0 to 3.6 mm over 12 degrees (u 0 to 12): 5.4 mm, 37 degrees at 34 mm out. The leading corner is chamfered: 10.0 mm at the end, meeting the ramp 1 mm (1.64 degrees at 35 mm) on.</text>
